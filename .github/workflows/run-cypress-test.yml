name: E2E Tests
# Installs AB with the given runtime and runs our e2e tests against this repo's specs.
# Thin wrapper around the shared workflow (image pre-pull, caching, readiness wait instead of sleep):
# https://github.com/CruGlobal-AI/ab-workflows/blob/main/.github/workflows/cypress-e2e-tests.yml
on:
   workflow_call:
      inputs:
         ref:
            required: true
            type: string
   push:
      branches: [master]

   # Run on pull requests into the #master branch
   pull_request:
      branches: [master]

   # Allows user to trigger the workflow from GitHub's web UI
   workflow_dispatch:
jobs:
   cypress-test:
      name: Cypress E2E Tests
      uses: CruGlobal-AI/ab-workflows/.github/workflows/cypress-e2e-tests.yml@main
      with:
         # ab_runtime ref when called from another workflow; empty = default branch
         runtime: ${{ inputs.ref }}
         # Test this repo's own specs when running here (another caller gets the default branch)
         kitchensink_ref: ${{ github.repository == format('{0}/kitchensink_app', github.repository_owner) && github.ref || '' }}
         config: ab-runtime
         folder: ab
         port: "8080"
         timeout_minutes: 30
