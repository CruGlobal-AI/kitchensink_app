name: E2E Tests
# Installs AB with the given runtime and run our e2e test.
on:
   workflow_call:
      inputs:
         ref:
            required: true
            type: string
   push:
      branches: [master]

   # Run on pull requests into the #master branch
   pull_request:
      branches: [master]

   # Allows user to trigger the workflow from GitHub's web UI
   workflow_dispatch:
jobs:
   cypress-test:
      name: Cypress E2E Tests
      runs-on: ubuntu-latest
      timeout-minutes: 30
      env:
         CYPRESS_RESPONSE_TIMEOUT: 200000
         CYPRESS_DEFAULT_COMMAND_TIMEOUT: 30000
         CYPRESS_RETRIES: 2
      steps:
         - name: Install AppBuilder
           uses: CruGlobal-AI/ab-install-action@v1
           with:
              folder: ab
              port: 8080
              runtime: ${{ inputs.ref }}

         - name: Check out kitchen-sink tests
           uses: actions/checkout@v4
           with:
              path: ab/test/e2e/cypress/e2e/kitchensink_app

         - name: Deploy Stack
           run: ./UP.sh -t -q
           working-directory: ./ab

         # These next steps are to save our ablogs to file
         - run: npm install pm2@latest -g
         - name: Save Logs
           run: pm2 start ./logs.js -- --toFile logs/ABServices.log
           working-directory: ./ab

         - name: Wait for services to be ready
           run: |
              # List of services to check
              SERVICES_TO_CHECK=("ab_db" "ab_redis" "ab_web")
              TIMEOUT=3000

              for SERVICE in "${SERVICES_TO_CHECK[@]}"; do
                 echo "Waiting for service: $SERVICE"
                 start_time=$(date +%s)
                 while true; do
                 if docker service ls | grep "$SERVICE" | grep "1/1"; then
                    echo "$SERVICE is ready. ✅"
                    break
                 fi

                 current_time=$(date +%s)
                 elapsed_time=$((current_time - start_time))

                 if [ $elapsed_time -ge $TIMEOUT ]; then
                    echo "❌ Timed out waiting for $SERVICE."
                    docker service ls
                    exit 1
                 fi

                 echo "Waiting for $SERVICE to start... ($elapsed_time/${TIMEOUT}s)"
                 sleep 5
                 done
              done

         # ab_web being up is not enough. nginx returns 502 until api_sails
         # is listening, and the first /test/reset call then fails every spec.
         - name: Wait for the API to answer
           timeout-minutes: 12
           run: |
              for i in $(seq 1 120); do
                 code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' http://localhost:8080/app_builder/model/ping || true)
                 case "$code" in
                    000|502|503|504) echo "API not ready ($code), waiting... ($i/120)"; sleep 5 ;;
                    *) echo "API answered with $code. ✅"; exit 0 ;;
                 esac
              done
              echo "❌ Timed out waiting for the API."
              docker service ls
              exit 1

         - name: Run Cypress Tests
           run: npm run test:e2e:ab-runtime -- --browser chrome
           working-directory: ./ab

         - uses: actions/upload-artifact@v4
           if: failure()
           with:
              name: cypress-screenshots
              path: ./ab/test/e2e/cypress/screenshots

         - uses: actions/upload-artifact@v4
           if: failure()
           with:
              name: ABServices.log
              path: ./ab/logs/ABServices.log
